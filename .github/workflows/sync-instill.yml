name: Sync weekly plans from Instill
on:
  schedule:
    - cron: "17 3 * * *"   # every night at 03:17 UTC
  workflow_dispatch: {}    # "Run workflow" button for a manual update
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch this week's classes
        run: python3 tools/sync_instill.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- website/classes.js; then echo "No changes"; exit 0; fi
          git config user.name "sjelehagen-sync"
          git config user.email "actions@users.noreply.github.com"
          git add website/classes.js
          git commit -m "Sync weekly plans from Instill"
          git push
